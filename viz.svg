<text x="56.0" y="323.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">At 4: its predecessor is 3 (rightmost of the left subtree). First visit: thread 3→4</text>
<text x="56.0" y="342.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">and descend left. When the walk later climbs through 3 and follows the thread BACK</text>
<text x="56.0" y="361.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">to 4, the thread's existence says 'left side done' — visit 4, remove the thread.</text>
