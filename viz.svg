<text x="56.0" y="586.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Output: 1..7, tree restored exactly. Each edge is walked at most 3 times → still</text>
<text x="56.0" y="605.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">O(n). The cost: the tree is briefly inconsistent — unacceptable if concurrent</text>
<text x="56.0" y="624.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">readers exist.</text>
